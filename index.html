<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0f1115">
  <meta name="description" content="Шахматы с ботом и игрой по сети. Скоро — способности.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Шахматы">
  <title>Шахматы+</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Набор иконок интерфейса -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-flip" viewBox="0 0 24 24"><path d="M7 4v14m0 0l-3-3m3 3l3-3M17 20V6m0 0l-3 3m3-3l3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4m0 0h11l-2 4 2 4H5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-hand" viewBox="0 0 24 24"><path d="M3 12l4-4 3 1 3-3 4 4-5 5a1.5 1.5 0 01-2-2m-7-1l6 6a1.5 1.5 0 002-2m-3 3a1.5 1.5 0 002 0M17 10l4 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 9V6.5A2.5 2.5 0 0012.5 4h-6A2.5 2.5 0 004 6.5v6A2.5 2.5 0 006.5 15H9" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3m0 0L8 7m4-4l4 4M5 12v6a3 3 0 003 3h8a3 3 0 003-3v-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 2v3m4-3v3M10 19v3m4-3v3M2 10h3m-3 4h3M19 10h3m-3 4h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="2" fill="currentColor"/></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2.5 20c.6-3.5 3.2-5.5 6.5-5.5s5.9 2 6.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M16 4.8a3.5 3.5 0 010 6.4M18.5 14.8c1.7.8 2.7 2.6 3 5.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M17 9l5 6m0-6l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 2l2.2 6.3L20.5 10l-6.3 2.2L12 18.5l-2.2-6.3L3.5 10l6.3-1.7z" fill="currentColor"/></symbol>
    </defs>
  </svg>

  <div id="app">

    <!-- ================= ГЛАВНОЕ МЕНЮ ================= -->
    <section class="screen active" id="screen-menu">
      <div class="menu-wrap">
        <div class="hero">
          <div class="hero-pieces" aria-hidden="true">
            <img src="pieces/bR.svg" alt=""><img src="pieces/wN.svg" alt="" class="hero-main"><img src="pieces/bB.svg" alt="">
          </div>
          <h1 class="logo">Шахматы<span>+</span></h1>
          <p class="tagline"><svg class="ico"><use href="#i-spark"/></svg> Скоро: способности</p>
        </div>

        <div class="mode-list">
          <button class="mode-card" data-go="bot">
            <span class="mode-ico"><svg><use href="#i-cpu"/></svg></span>
            <span class="mode-text"><b>Играть с ботом</b><small>4 уровня сложности</small></span>
          </button>
          <button class="mode-card accent" data-go="online">
            <span class="mode-ico"><svg><use href="#i-globe"/></svg></span>
            <span class="mode-text"><b>Играть по сети</b><small>С другом — по коду или ссылке</small></span>
          </button>
          <button class="mode-card" data-go="local">
            <span class="mode-ico"><svg><use href="#i-users"/></svg></span>
            <span class="mode-text"><b>На одном устройстве</b><small>Передавайте телефон друг другу</small></span>
          </button>
        </div>

        <div class="settings-row">
          <div class="theme-picker" id="theme-picker" aria-label="Цвет доски"></div>
          <button class="icon-btn" id="sound-btn" title="Звук"><svg><use href="#i-sound"/></svg></button>
        </div>
      </div>
    </section>

    <!-- ================= НАСТРОЙКА БОТА ================= -->
    <section class="screen" id="screen-bot">
      <div class="panel-wrap">
        <header class="screen-head">
          <button class="icon-btn" data-go="menu"><svg><use href="#i-back"/></svg></button>
          <h2>Игра с ботом</h2>
        </header>

        <div class="field">
          <label>Играю за</label>
          <div class="seg" id="bot-color">
            <button data-v="w" class="on"><img src="pieces/wK.svg" alt="">Белых</button>
            <button data-v="r"><span class="rand-ico"><img src="pieces/wK.svg" alt=""><img src="pieces/bK.svg" alt=""></span>Случайно</button>
            <button data-v="b"><img src="pieces/bK.svg" alt="">Чёрных</button>
          </div>
        </div>

        <div class="field">
          <label>Сложность</label>
          <div class="levels" id="bot-level">
            <button data-v="1"><span class="pips"><i></i><i></i><i></i><i></i></span><b>Новичок</b><small>Часто ошибается</small></button>
            <button data-v="2" class="on"><span class="pips"><i></i><i></i><i></i><i></i></span><b>Любитель</b><small>Для разминки</small></button>
            <button data-v="3"><span class="pips"><i></i><i></i><i></i><i></i></span><b>Опытный</b><small>Думает на 4 хода</small></button>
            <button data-v="4"><span class="pips"><i></i><i></i><i></i><i></i></span><b>Мастер</b><small>Не прощает ошибок</small></button>
          </div>
        </div>

        <button class="btn primary big" id="bot-start">Начать партию</button>
      </div>
    </section>

    <!-- ================= ИГРА ПО СЕТИ ================= -->
    <section class="screen" id="screen-online">
      <div class="panel-wrap">
        <header class="screen-head">
          <button class="icon-btn" id="online-back"><svg><use href="#i-back"/></svg></button>
          <h2>Игра по сети</h2>
        </header>

        <div id="online-setup">
          <div class="field">
            <label for="my-name">Твоё имя</label>
            <input id="my-name" class="input" maxlength="16" placeholder="Например, Саша" autocomplete="nickname">
          </div>

          <div class="card">
            <h3>Создать игру</h3>
            <p class="muted">Получишь код — отправь его сопернику.</p>
            <div class="seg small" id="host-color">
              <button data-v="w" class="on"><img src="pieces/wK.svg" alt="">Белые</button>
              <button data-v="r"><span class="rand-ico"><img src="pieces/wK.svg" alt=""><img src="pieces/bK.svg" alt=""></span>Случайно</button>
              <button data-v="b"><img src="pieces/bK.svg" alt="">Чёрные</button>
            </div>
            <button class="btn primary" id="host-btn">Создать</button>
          </div>

          <div class="divider"><span>или</span></div>

          <div class="card">
            <h3>Присоединиться</h3>
            <div class="join-row">
              <input id="join-code" class="input code-input" maxlength="5" placeholder="КОД" autocomplete="off" autocapitalize="characters" spellcheck="false">
              <button class="btn primary" id="join-btn">Войти</button>
            </div>
          </div>
        </div>

        <div id="online-wait" class="hidden">
          <div class="card center">
            <p class="muted">Код игры</p>
            <div class="big-code" id="big-code">·····</div>
            <div class="wait-actions">
              <button class="btn" id="copy-link"><svg class="ico"><use href="#i-copy"/></svg>Скопировать ссылку</button>
              <button class="btn" id="share-link"><svg class="ico"><use href="#i-share"/></svg>Отправить</button>
            </div>
            <div class="waiting"><span class="spinner"></span><span id="wait-text">Подключаюсь к серверу…</span></div>
          </div>
          <p class="hint-text">Соперник может открыть ссылку или ввести код в разделе «Играть по сети».</p>
        </div>
      </div>
    </section>

    <!-- ================= ПАРТИЯ ================= -->
    <section class="screen" id="screen-game">
      <header class="game-head">
        <button class="icon-btn" id="game-menu" title="В меню"><svg><use href="#i-back"/></svg></button>
        <div class="status" id="status"><span class="status-dot"></span><span id="status-text">Ход белых</span></div>
        <div class="net-pill hidden" id="net-pill"><span></span><b>Онлайн</b></div>
        <button class="icon-btn" id="flip-btn" title="Перевернуть доску"><svg><use href="#i-flip"/></svg></button>
      </header>

      <div class="game-layout">
        <div class="board-col">
          <div class="player" id="player-top">
            <div class="avatar"></div>
            <div class="pinfo"><b class="pname"></b><div class="captured"></div></div>
            <div class="clock-dot"></div>
          </div>

          <div class="board-frame">
            <div id="board" class="board">
              <div class="squares" id="squares"></div>
              <div class="pieces" id="pieces"></div>
            </div>
          </div>

          <div class="player" id="player-bottom">
            <div class="avatar"></div>
            <div class="pinfo"><b class="pname"></b><div class="captured"></div></div>
            <div class="clock-dot"></div>
          </div>
        </div>

        <aside class="side">
          <div class="moves" id="moves"></div>
          <div class="actions">
            <button class="act" id="undo-btn"><svg><use href="#i-undo"/></svg><span>Назад</span></button>
            <button class="act" id="draw-btn"><svg><use href="#i-hand"/></svg><span>Ничья</span></button>
            <button class="act" id="resign-btn"><svg><use href="#i-flag"/></svg><span>Сдаться</span></button>
            <button class="act" id="new-btn"><svg><use href="#i-plus"/></svg><span>Заново</span></button>
          </div>
        </aside>
      </div>
    </section>
  </div>

  <div class="modal-back hidden" id="modal"><div class="modal" id="modal-box"></div></div>
  <div class="toast" id="toast"></div>

  <script src="js/peerjs.min.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/net.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
